<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>及时雨 // NEURAL_LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #02020a;
  --bg1: #05050f;
  --bg2: #080814;
  --panel: #0a0a18;
  --panel2: #0d0d1f;
  --pink: #ff2d78;
  --pink-dim: #8b1040;
  --pink-faint: #1a0510;
  --cyan: #00f5ff;
  --cyan-dim: #006b70;
  --cyan-faint: #001a1c;
  --yellow: #f5e642;
  --yellow-dim: #6b6200;
  --purple: #9d00ff;
  --purple-dim: #4a007a;
  --purple-faint: #110020;
  --text: #c8cce8;
  --text-dim: #5a5e7a;
  --text-faint: #2a2e48;
  --border: #1a1a30;
  --border-bright: #2a2a50;
  --glow-pink: 0 0 10px rgba(255,45,120,0.6), 0 0 30px rgba(255,45,120,0.2);
  --glow-cyan: 0 0 10px rgba(0,245,255,0.6), 0 0 30px rgba(0,245,255,0.2);
  --glow-yellow: 0 0 10px rgba(245,230,66,0.5), 0 0 25px rgba(245,230,66,0.15);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg0);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
}

/* ── GRID BACKGROUND ── */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ── VIGNETTE ── */
body::after {
  content:'';
  position:fixed; inset:0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(2,2,10,0.85) 100%);
  pointer-events:none;
  z-index:1;
}

/* ── GLITCH KEYFRAMES ── */
@keyframes glitch1 {
  0%,94%,100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
  95% { clip-path: inset(20% 0 60% 0); transform: translateX(-4px); }
  97% { clip-path: inset(50% 0 30% 0); transform: translateX(4px); }
  99% { clip-path: inset(70% 0 10% 0); transform: translateX(-2px); }
}
@keyframes glitch2 {
  0%,92%,100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
  93% { clip-path: inset(10% 0 80% 0); transform: translateX(5px); }
  96% { clip-path: inset(60% 0 20% 0); transform: translateX(-5px); }
  98% { clip-path: inset(30% 0 50% 0); transform: translateX(3px); }
}
@keyframes flicker {
  0%,96%,100% { opacity:1; }
  97% { opacity:0.7; }
  98% { opacity:1; }
  99% { opacity:0.5; }
}
@keyframes pulse-border {
  0%,100% { border-color: var(--pink-dim); box-shadow: none; }
  50% { border-color: var(--pink); box-shadow: var(--glow-pink); }
}
@keyframes slideup {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes neon-flicker {
  0%,19%,21%,23%,25%,54%,56%,100% {
    text-shadow: var(--glow-cyan);
    color: var(--cyan);
  }
  20%,24%,55% {
    text-shadow: none;
    color: var(--cyan-dim);
  }
}
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes blink {
  0%,49% { opacity:1; }
  50%,100% { opacity:0; }
}

/* ── HEADER ── */
header {
  position:sticky; top:0; z-index:100;
  background: linear-gradient(180deg, rgba(2,2,10,0.98) 0%, rgba(5,5,15,0.95) 100%);
  border-bottom: 1px solid var(--border-bright);
  backdrop-filter: blur(12px);
  animation: flicker 12s ease-in-out infinite;
}

.header-inner {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 28px;
  position:relative;
}

.header-inner::after {
  content:'';
  position:absolute; bottom:0; left:28px; right:28px;
  height:1px;
  background: linear-gradient(90deg, transparent, var(--pink), var(--cyan), transparent);
  opacity:0.4;
}

/* LOGO */
.logo-wrap { position:relative; display:inline-block; }

.logo {
  font-family:'Orbitron', monospace;
  font-size:1.6rem;
  font-weight:900;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing:3px;
  text-transform:uppercase;
  animation: neon-flicker 8s ease-in-out infinite;
  position:relative;
  z-index:2;
}

.logo-glitch1, .logo-glitch2 {
  position:absolute; top:0; left:0;
  font-family:'Orbitron', monospace;
  font-size:1.6rem;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
  pointer-events:none;
}
.logo-glitch1 { color:var(--pink); animation: glitch1 6s infinite; z-index:3; }
.logo-glitch2 { color:var(--yellow); animation: glitch2 7s infinite; z-index:3; }

.logo-sub {
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  color:var(--text-dim);
  letter-spacing:4px;
  margin-top:2px;
  text-transform:uppercase;
}

.logo-sub span { color:var(--pink); }

/* HEADER RIGHT */
.header-right {
  display:flex; flex-direction:column; align-items:flex-end; gap:4px;
}

.stat-line {
  font-family:'Share Tech Mono', monospace;
  font-size:0.68rem;
  color:var(--text-dim);
  display:flex; gap:16px;
}

.stat-line .val { color:var(--cyan); text-shadow:var(--glow-cyan); }
.stat-line .val-pink { color:var(--pink); text-shadow:var(--glow-pink); }

.back-link {
  font-family:'Share Tech Mono', monospace;
  font-size:0.68rem;
  color:var(--text-dim);
  text-decoration:none;
  letter-spacing:2px;
  padding:4px 0;
  transition:color 0.2s ease, text-shadow 0.2s ease;
}
.back-link:hover {
  color:var(--cyan);
  text-shadow:var(--glow-cyan);
}

/* HEX DECORATION */
.hex-deco {
  width:28px; height:28px;
  border: 1px solid var(--pink-dim);
  transform: rotate(45deg);
  position:relative;
  animation: pulse-border 3s ease-in-out infinite;
  flex-shrink:0;
}
.hex-deco::after {
  content:'';
  position:absolute; inset:4px;
  background:var(--pink);
  transform:rotate(0deg);
  opacity:0.3;
}

/* NAV TABS */
.nav-wrap {
  display:flex; align-items:center;
  padding: 0 28px;
  border-top: 1px solid var(--border);
  overflow-x:auto; scrollbar-width:none;
  gap:2px;
}
.nav-wrap::-webkit-scrollbar { display:none; }

.nav-tab {
  padding: 8px 16px;
  font-family:'Rajdhani', sans-serif;
  font-size:0.78rem;
  font-weight:600;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  cursor:pointer;
  white-space:nowrap;
  position:relative;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
  user-select:none;
}
.nav-tab::before {
  content:'';
  position:absolute; bottom:-2px; left:0; right:0;
  height:2px;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  transform:scaleX(0);
  transition: transform 0.2s;
}
.nav-tab:hover { color:var(--text); }
.nav-tab:hover::before { transform:scaleX(1); }
.nav-tab.active {
  color:var(--cyan);
  text-shadow:var(--glow-cyan);
}
.nav-tab.active::before { transform:scaleX(1); }

/* ── STATUS BAR ── */
.status-bar {
  display:flex; align-items:center; gap:24px;
  padding: 8px 28px;
  background:rgba(0,245,255,0.03);
  border-bottom:1px solid var(--border);
  font-family:'Share Tech Mono', monospace;
  font-size:0.65rem;
  color:var(--text-faint);
  flex-wrap:wrap;
}
.status-bar .s { display:flex; align-items:center; gap:8px; }
.status-bar .s::before { content:'//'; color:var(--pink-dim); }
.status-bar .sv { color:var(--cyan); font-size:0.72rem; }
.status-bar .sv-p { color:var(--pink); font-size:0.72rem; }
.status-bar .pulse {
  width:6px; height:6px;
  background:var(--cyan);
  border-radius:50%;
  box-shadow:var(--glow-cyan);
  animation: blink 1.2s step-end infinite;
}

/* ── LAYOUT ── */
.layout {
  display:grid;
  grid-template-columns: 230px 1fr;
  min-height: calc(100vh - 120px);
  position:relative; z-index:2;
}

/* ── SIDEBAR ── */
.sidebar {
  border-right:1px solid var(--border);
  padding:20px 0;
  position:sticky; top:120px;
  height:calc(100vh - 120px);
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color: var(--pink-dim) transparent;
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
}

.sidebar-label {
  padding:8px 20px;
  font-family:'Share Tech Mono', monospace;
  font-size:0.58rem;
  letter-spacing:4px;
  color:var(--text-faint);
  text-transform:uppercase;
  margin-top:12px;
  display:flex; align-items:center; gap:8px;
}
.sidebar-label::after {
  content:'';
  flex:1; height:1px;
  background:linear-gradient(90deg, var(--border-bright), transparent);
}

.sitem {
  display:flex; align-items:center; gap:10px;
  padding:8px 20px;
  cursor:pointer;
  font-family:'Rajdhani', sans-serif;
  font-size:0.82rem;
  font-weight:500;
  letter-spacing:1px;
  color:var(--text-dim);
  border-left:2px solid transparent;
  transition:all 0.15s;
  position:relative;
  overflow:hidden;
}
.sitem::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(255,45,120,0.06), transparent);
  opacity:0; transition:opacity 0.15s;
}
.sitem:hover { color:var(--text); border-left-color:var(--pink-dim); }
.sitem:hover::before { opacity:1; }
.sitem.active {
  color:var(--cyan);
  border-left-color:var(--cyan);
  text-shadow:0 0 8px rgba(0,245,255,0.4);
  background:linear-gradient(90deg, rgba(0,245,255,0.05), transparent);
}
.sitem.active::before { opacity:0; }

.sitem-icon { font-size:0.9rem; flex-shrink:0; width:18px; text-align:center; }
.sitem-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase; }
.sitem-count {
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  color:var(--text-faint);
  background:var(--border);
  padding:1px 6px;
  border-radius:2px;
  flex-shrink:0;
}
.sitem.active .sitem-count {
  color:var(--cyan-dim);
  background:var(--cyan-faint);
  border:1px solid var(--cyan-dim);
}

/* ── MAIN ── */
.main {
  padding:24px 28px;
  min-width:0;
  position:relative;
}

/* ── SEARCH ── */
.search-wrap {
  position:relative; margin-bottom:24px;
}

.search-box {
  display:flex; align-items:center;
  background:var(--panel);
  border:1px solid var(--border-bright);
  padding:12px 16px;
  gap:12px;
  position:relative;
  transition:all 0.2s;
}
.search-box::before {
  content:'SEARCH //';
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  letter-spacing:2px;
  color:var(--pink);
  text-shadow:var(--glow-pink);
  flex-shrink:0;
}
.search-box::after {
  content:'';
  position:absolute; bottom:-1px; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, var(--pink), var(--cyan), transparent);
  opacity:0;
  transition:opacity 0.2s;
}
.search-wrap:focus-within .search-box {
  border-color:var(--pink-dim);
  box-shadow: 0 0 20px rgba(255,45,120,0.1);
}
.search-wrap:focus-within .search-box::after { opacity:1; }

.search-input {
  flex:1; background:transparent; border:none; outline:none;
  font-family:'Rajdhani', sans-serif;
  font-size:0.95rem;
  font-weight:500;
  letter-spacing:1px;
  color:var(--text);
  caret-color:var(--pink);
}
.search-input::placeholder { color:var(--text-faint); }

.search-count {
  font-family:'Share Tech Mono', monospace;
  font-size:0.65rem;
  color:var(--text-faint);
  flex-shrink:0;
}

/* ── CATEGORY HEADER ── */
.cat-head {
  display:flex; align-items:center; gap:14px;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.cat-head::after {
  content:'';
  position:absolute; bottom:-1px; left:0; width:60px;
  height:1px;
  background:linear-gradient(90deg, var(--pink), transparent);
}
.cat-head-icon { font-size:1.3rem; }
.cat-head-title {
  font-family:'Orbitron', monospace;
  font-size:1.1rem;
  font-weight:700;
  color:var(--pink);
  text-shadow:var(--glow-pink);
  letter-spacing:3px;
  text-transform:uppercase;
}
.cat-head-slash { color:var(--text-faint); font-family:'Share Tech Mono', monospace; }
.cat-head-sub {
  font-family:'Share Tech Mono', monospace;
  font-size:0.65rem;
  color:var(--text-faint);
  margin-left:auto;
  letter-spacing:2px;
}

/* ── CARDS GRID ── */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap:12px;
}

/* ── CARD ── */
.card {
  display:flex; flex-direction:column; gap:8px;
  padding:14px 16px;
  background:var(--panel);
  border:1px solid var(--border);
  border-top:2px solid var(--border-bright);
  text-decoration:none; color:inherit;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all 0.2s;
  animation: slideup 0.35s ease both;
}

/* corner accent */
.card::before {
  content:'';
  position:absolute; top:0; right:0;
  width:0; height:0;
  border-style:solid;
  border-width:0 20px 20px 0;
  border-color:transparent var(--pink-dim) transparent transparent;
  transition:border-color 0.2s;
}
/* bottom bar */
.card::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, var(--pink), transparent);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform 0.3s ease;
}

.card:hover {
  border-color:var(--pink-dim);
  border-top-color:var(--pink);
  background:var(--panel2);
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,45,120,0.1);
}
.card:hover::before { border-color:transparent var(--pink) transparent transparent; }
.card:hover::after { transform:scaleX(1); }

/* card scan line on hover */
.card-scan {
  position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,45,120,0.04), transparent);
  transition: left 0.4s ease;
  pointer-events:none;
}
.card:hover .card-scan { left:100%; }

.card-title {
  font-family:'Rajdhani', sans-serif;
  font-size:0.88rem;
  font-weight:600;
  letter-spacing:0.5px;
  color:var(--text);
  line-height:1.4;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  transition:color 0.2s;
  position:relative;
}
.card:hover .card-title { color:var(--pink); text-shadow:0 0 8px rgba(255,45,120,0.3); }

.card-meta {
  display:flex; align-items:center; gap:8px;
}

.card-domain {
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  color:var(--cyan-dim);
  background:var(--cyan-faint);
  border:1px solid rgba(0,245,255,0.08);
  padding:2px 8px;
  letter-spacing:1px;
  flex-shrink:0;
  transition:all 0.2s;
}
.card:hover .card-domain {
  color:var(--cyan);
  border-color:rgba(0,245,255,0.25);
  text-shadow:var(--glow-cyan);
}

/* ── ALL VIEW SECTIONS ── */
.section { margin-bottom:36px; }
.section-head {
  display:flex; align-items:center; gap:10px;
  margin-bottom:14px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  position:relative;
}
.section-head::before {
  content:'';
  position:absolute; bottom:-1px; left:0; width:40px;
  height:1px; background:var(--pink);
  box-shadow:var(--glow-pink);
}
.section-head-icon { font-size:1rem; }
.section-head-name {
  font-family:'Rajdhani', sans-serif;
  font-size:0.85rem;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--yellow);
  text-shadow:var(--glow-yellow);
}
.section-head-num {
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  color:var(--text-faint);
  margin-left:auto;
}

/* ── EMPTY ── */
.empty {
  text-align:center; padding:80px 20px;
  color:var(--text-faint);
}
.empty-code {
  font-family:'Orbitron', monospace;
  font-size:3rem;
  color:var(--border-bright);
  display:block; margin-bottom:16px;
  text-shadow: 0 0 30px rgba(255,45,120,0.1);
}
.empty-msg {
  font-family:'Share Tech Mono', monospace;
  font-size:0.75rem;
  letter-spacing:2px;
}

/* ── FOOTER ── */
footer {
  position:relative; z-index:2;
  border-top:1px solid var(--border);
  padding:12px 28px;
  display:flex; justify-content:space-between; align-items:center;
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem;
  color:var(--text-faint);
  background:var(--bg1);
}
.footer-left { display:flex; align-items:center; gap:16px; }
.footer-left .dot {
  width:5px; height:5px;
  background:var(--pink);
  box-shadow:var(--glow-pink);
  border-radius:50%;
  animation:blink 1.5s step-end infinite;
}
footer .c { color:var(--cyan); }
footer .p { color:var(--pink); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:var(--bg0); }
::-webkit-scrollbar-thumb { background:var(--pink-dim); }
::-webkit-scrollbar-thumb:hover { background:var(--pink); }

/* ── STAGGER ANIMATION ── */
.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.06s}
.card:nth-child(4){animation-delay:.08s}
.card:nth-child(5){animation-delay:.10s}
.card:nth-child(6){animation-delay:.12s}
.card:nth-child(7){animation-delay:.14s}
.card:nth-child(8){animation-delay:.16s}
.card:nth-child(9){animation-delay:.18s}
.card:nth-child(10){animation-delay:.20s}
.card:nth-child(11){animation-delay:.22s}
.card:nth-child(12){animation-delay:.24s}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid{grid-template-columns:1fr 1fr}
  header .header-inner{padding:10px 16px}
  .main{padding:16px}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <a class="back-link" href="/">← 返回主页</a>
      <div class="logo-wrap">
        <div class="logo">及时雨 // NEURAL_LINK</div>
        <div class="logo-glitch1">及时雨 // NEURAL_LINK</div>
        <div class="logo-glitch2">及时雨 // NEURAL_LINK</div>
      </div>
      <div class="logo-sub">BOOKMARK_ARCHIVE · <span>SECTOR_7G</span> · NET_RUNNER_DB</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="header-right">
        <div class="stat-line">
          <span>NODES <span class="val" id="totalCount">313</span></span>
          <span>SECTORS <span class="val" id="catCount">12</span></span>
        </div>
        <div class="stat-line">
          <span>ACTIVE <span class="val-pink" id="visibleCount">313</span></span>
          <span>FILTER <span class="val" id="filterStatus">NULL</span></span>
        </div>
      </div>
      <div class="hex-deco"></div>
    </div>
  </div>
  <div class="status-bar">
    <div class="s"><span class="pulse"></span> SYSTEM ONLINE</div>
    <div class="s">SECTOR <span class="sv" id="activeSector">ALL</span></div>
    <div class="s">QUERY <span class="sv-p" id="queryStatus">IDLE</span></div>
    <div class="s" style="margin-left:auto;color:var(--text-faint)">
      SYS_VER 2.1.88 · UPTIME 99.7%
    </div>
  </div>
  <div class="nav-wrap" id="navWrap"></div>
</header>

<div class="layout">

const allItems = DATA.categories.flatMap(c => c.items.map(i=>({...i,catId:c.id,catName:c.name,catIcon:c.icon})));
let currentCat = 'all';
let searchQuery = '';

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); }
  catch { return url.slice(0,20); }
}

function buildSidebar() {
  const el = document.getElementById('sidebar');
  let h = '<div class="sidebar-label">// SECTORS</div>';
  h += `<div class="sitem ${currentCat==='all'?'active':''}" onclick="selectCat('all')">
    <span class="sitem-icon">📡</span>
    <span class="sitem-name">ALL NODES</span>
    <span class="sitem-count">${allItems.length}</span>
  </div>`;
  DATA.categories.forEach(c=>{
    h+=`<div class="sitem ${currentCat===c.id?'active':''}" onclick="selectCat('${c.id}')">
      <span class="sitem-icon">${c.icon}</span>
      <span class="sitem-name">${c.name}</span>
      <span class="sitem-count">${c.items.length}</span>
    </div>`;
  });
  el.innerHTML = h;
}

function buildNav() {
  const el = document.getElementById('navWrap');
  let h = `<div class="nav-tab ${currentCat==='all'?'active':''}" onclick="selectCat('all')">ALL</div>`;
  DATA.categories.forEach(c=>{
    h+=`<div class="nav-tab ${currentCat===c.id?'active':''}" onclick="selectCat('${c.id}')">${c.icon} ${c.name}</div>`;
  });
  el.innerHTML = h;
}

function card(item, i) {
  return `<a class="card" href="${item.url}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i,12)*.025}s">
    <div class="card-scan"></div>
    <div class="card-title">${item.title}</div>
    <div class="card-meta">
      <div class="card-domain">${getDomain(item.url)}</div>
    </div>
  </a>`;
}

function buildContent() {
  const el = document.getElementById('content');
  const q = searchQuery.toLowerCase();
  let items = currentCat==='all' ? allItems : allItems.filter(i=>i.catId===currentCat);
  if(q) items = items.filter(i=>i.title.toLowerCase().includes(q)||getDomain(i.url).includes(q));

  document.getElementById('visibleCount').textContent = items.length;
  document.getElementById('filterStatus').textContent = q ? 'ACTIVE' : 'NULL';
  document.getElementById('queryStatus').textContent = q ? `"${searchQuery.toUpperCase()}"` : 'IDLE';
  document.getElementById('searchCount').textContent = q ? `${items.length} NODES` : '';

  if(!items.length){
    el.innerHTML=`<div class="empty">
      <span class="empty-code">404</span>
      <span class="empty-msg">// NODE NOT FOUND IN NEURAL NETWORK</span>
    </div>`;
    return;
  }

  if(currentCat==='all' && !q){
    let h='';
    DATA.categories.forEach(c=>{
      const ci = items.filter(i=>i.catId===c.id);
      if(!ci.length) return;
      h+=`<div class="section">
        <div class="section-head">
          <span class="section-head-icon">${c.icon}</span>
          <span class="section-head-name">${c.name}</span>
          <span class="section-head-num">${ci.length} nodes</span>
        </div>
        <div class="grid">${ci.map((item,i)=>card(item,i)).join('')}</div>
      </div>`;
    });
    el.innerHTML = h;
  } else {
    const c = currentCat!=='all' ? DATA.categories.find(x=>x.id===currentCat) : null;
    let h='';
    if(c){
      h+=`<div class="cat-head">
        <span class="cat-head-icon">${c.icon}</span>
        <span class="cat-head-title">${c.name}</span>
        <span class="cat-head-slash"> // </span>
        <span style="font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--text-faint);letter-spacing:2px;">${c.desc}</span>
        <span class="cat-head-sub">${items.length} NODES</span>
      </div>`;
    } else if(q){
      h+=`<div class="cat-head">
        <span class="cat-head-icon">🔍</span>
        <span class="cat-head-title">SEARCH</span>
        <span class="cat-head-slash"> // </span>
        <span style="font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--pink);letter-spacing:2px;">"${searchQuery.toUpperCase()}"</span>
        <span class="cat-head-sub">${items.length} RESULTS</span>
      </div>`;
    }
    h+=`<div class="grid">${items.map((item,i)=>card(item,i)).join('')}</div>`;
    el.innerHTML = h;
  }
}

function selectCat(id){
  currentCat = id;
  document.getElementById('activeSector').textContent = id==='all' ? 'ALL' : DATA.categories.find(c=>c.id===id)?.name||id;
  buildSidebar(); buildNav(); buildContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('searchInput').addEventListener('input',function(){
  searchQuery = this.value.trim();
  if(searchQuery) currentCat='all';
  buildSidebar(); buildNav(); buildContent();
});

document.getElementById('totalCount').textContent = allItems.length;
document.getElementById('catCount').textContent = DATA.categories.length;
buildSidebar(); buildNav(); buildContent();
</script>
